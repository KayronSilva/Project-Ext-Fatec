<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Devoluções{% endblock %}</title>

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">

    {% block extra_head %}{% endblock %}

    <style>
        /* ════════════════════════════════════════════════
           VARIÁVEIS GLOBAIS — único lugar para mudar cores
           ════════════════════════════════════════════════ */
        :root {
            --bg:            #f5f7fa;
            --surface:       #ffffff;
            --surface-2:     #f8f9fb;
            --surface-3:     #f1f3f5;
            --border:        #e2e8f0;
            --border-strong: #cbd5e1;
            --text:          #0f172a;
            --text-2:        #334155;
            --text-muted:    #64748b;
            --text-faint:    #94a3b8;
            --blue:          #2563eb;
            --blue-bg:       #eff6ff;
            --blue-border:   #bfdbfe;
            --blue-dark:     #1d4ed8;
            --red:           #dc2626;
            --r-sm:          8px;
            --r-md:          12px;
            --r-full:        9999px;
            --shadow-xs:     0 1px 3px rgba(0,0,0,.08);
        }

        /* ═══ RESET BÁSICO ═══ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Sora', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
            min-height: 100vh;
        }
        a { color: inherit; text-decoration: none; }
        img { max-width: 100%; }

        /* ═══ BOTÕES GLOBAIS ═══ */
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 16px; border-radius: var(--r-sm);
            font-size: 13px; font-weight: 600; font-family: inherit;
            cursor: pointer; border: 1.5px solid var(--border);
            background: var(--surface); color: var(--text-2);
            transition: all .15s; white-space: nowrap;
        }
        .btn:hover { border-color: var(--text-muted); }
        .btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
        .btn-primary:hover { opacity: .88; }
        .btn-secondary { background: var(--surface-2); }
        .btn-ghost { background: transparent; border-color: transparent; }
        .btn-ghost:hover { background: var(--surface-2); }
        .btn-sm { padding: 5px 12px; font-size: 12px; }
        .btn:disabled { opacity: .4; cursor: not-allowed; }

        /* ═══ CARD GLOBAL ═══ */
        .card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
        .card__section { padding: 24px; border-bottom: 1px solid var(--border); }
        .card__section:last-child { border-bottom: none; }

        /* ═══ MODAL GLOBAL ═══ */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 1000;
            background: rgba(0,0,0,.45); display: none;
            align-items: center; justify-content: center; padding: 24px;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--surface); border-radius: var(--r-md);
            width: 100%; max-width: 560px; max-height: 85vh;
            display: flex; flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,.2);
        }
        .modal--large { max-width: 780px; }
        .modal-header {
            display: flex; align-items: flex-start; justify-content: space-between;
            padding: 20px 24px 16px; border-bottom: 1px solid var(--border);
        }
        .modal-header h3 { font-size: 16px; font-weight: 700; }
        .modal-close {
            background: none; border: none; cursor: pointer;
            padding: 4px; color: var(--text-muted); border-radius: 4px;
        }
        .modal-close:hover { background: var(--surface-2); color: var(--text); }
        .modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
        .modal-footer {
            padding: 14px 24px; border-top: 1px solid var(--border);
            display: flex; justify-content: flex-end; gap: 8px;
        }
        .modal-meta {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px; padding: 16px 24px; background: var(--surface-2);
            border-bottom: 1px solid var(--border);
        }
        .meta-label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 2px; }
        .meta-value { font-size: 13.5px; font-weight: 600; }

        /* ═══ STATUS BADGE GLOBAL ═══ */
        .status-badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 10px; border-radius: var(--r-full);
            font-size: 11.5px; font-weight: 600;
            border: 1px solid var(--border);
            background: var(--surface-2); color: var(--text-2);
        }
        .status-ativa    { color: #15803d; background: #f0fdf4; border-color: #bbf7d0; }
        .status-devolvida{ color: #7c3aed; background: #faf5ff; border-color: #e9d5ff; }
        .status-cancelada{ color: #991b1b; background: #fef2f2; border-color: #fecaca; }
        .status-pendente { color: #c2410c; background: #fff7ed; border-color: #fed7aa; }
        .status-aprovada { color: #15803d; background: #f0fdf4; border-color: #bbf7d0; }
        .status-recusada { color: #991b1b; background: #fef2f2; border-color: #fecaca; }

        /* ═══ TABELA GLOBAL ═══ */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        thead th {
            text-align: left; padding: 10px 14px;
            font-size: 11px; font-weight: 600; text-transform: uppercase;
            color: var(--text-muted); background: var(--surface-2);
            border-bottom: 1px solid var(--border); cursor: default;
        }
        tbody td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
        tbody tr:hover { background: var(--surface-2); }
        tbody tr:last-child td { border-bottom: none; }

        /* ═══ PAGINAÇÃO GLOBAL ═══ */
        .pagination {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px; border-top: 1px solid var(--border);
            font-size: 12.5px; color: var(--text-muted);
        }
        .page-info { flex: 1; }
        .page-nav { display: flex; gap: 4px; }
        .page-btn {
            width: 32px; height: 32px; border: 1.5px solid var(--border);
            border-radius: var(--r-sm); background: var(--surface);
            cursor: pointer; font-size: 16px; display: flex;
            align-items: center; justify-content: center;
        }
        .page-btn:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
        .page-btn:disabled { opacity: .3; cursor: not-allowed; }

        /* ═══ TOOLBAR GLOBAL ═══ */
        .toolbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
        .search-wrap {
            display: flex; align-items: center; gap: 8px;
            padding: 7px 12px; background: var(--surface-2);
            border: 1.5px solid var(--border); border-radius: var(--r-sm); flex: 1;
        }
        .search-input { border: none; background: none; outline: none; font: inherit; width: 100%; font-size: 13px; }
        .toolbar-right { display: flex; gap: 8px; margin-left: auto; }

        /* ═══ TABS GLOBAL ═══ */
        .tabs { display: flex; gap: 0; border-bottom: 1.5px solid var(--border); padding: 0 16px; }
        .tab {
            padding: 11px 18px; font-size: 13px; font-weight: 500;
            color: var(--text-muted); cursor: pointer; border: none;
            background: none; font-family: inherit; border-bottom: 2px solid transparent;
            transition: color .15s, border-color .15s;
        }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }
        .tab-count { margin-left: 6px; padding: 1px 7px; background: var(--surface-2); border-radius: var(--r-full); font-size: 11px; font-weight: 600; }
        .tab-count.zero { opacity: .3; }

        /* ═══ EMPTY STATE GLOBAL ═══ */
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .empty-state-icon { font-size: 36px; margin-bottom: 10px; }
        .empty-state h3 { font-size: 15px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
        .empty-state p { font-size: 13px; }

        /* ═══ UTILITÁRIOS ═══ */
        .mono { font-family: 'SF Mono', 'Cascadia Code', monospace; }
        .page-wrapper { max-width: 960px; margin: 0 auto; padding: 28px 24px; }
        .page-wrapper--wide { max-width: 1200px; }
        .per-page-wrap { display: flex; align-items: center; gap: 6px; }
        .per-page-select { padding: 4px 8px; border: 1.5px solid var(--border); border-radius: var(--r-sm); font: inherit; font-size: 12px; background: var(--surface); }
        .density-btn { display: flex; align-items: center; gap: 5px; }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>

    {% block navbar %}{% endblock %}
    {% block content %}{% endblock %}

    <!-- Toast container global -->
    <div id="toast-container" aria-live="polite" aria-atomic="true"
         style="position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px"></div>

    <script>
    // ═══ UTILITÁRIOS JS GLOBAIS ═══
    const CSRF = (document.cookie.match(/csrftoken=([^;]+)/) || [])[1] || '';

    function esc(s) {
        return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function toast(msg, type = 'success') {
        const el = document.createElement('div');
        el.style.cssText = `padding:10px 16px;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18);background:${type === 'success' ? '#16a34a' : '#dc2626'}`;
        el.textContent = msg;
        document.getElementById('toast-container').appendChild(el);
        setTimeout(() => el.remove(), 3000);
    }
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
